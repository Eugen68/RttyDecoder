name: benchmark
on:
  pull_request:
    paths:
      - 'src/RttyDecoder.Core/**'
      - 'src/RttyDecoder.Audio/**'
      - 'tools/RttyDecoder.Benchmarks/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurements:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Corpus real (release recordings)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download recordings --repo Eugen68/RttyDecoder --pattern '*.wav' --dir recordings-data
      - name: Compilare benchmark
        run: dotnet build tools/RttyDecoder.Benchmarks -c Release
      - name: Temporizare FSK (fara hardware)
        run: dotnet tools/RttyDecoder.Benchmarks/bin/Release/net10.0/RttyDecoder.Benchmarks.dll fsk-timing --output benchmark-results
      - name: Decodare reproductibila (setari si SHA256 in rezultate)
        shell: pwsh
        env:
          BENCH_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: dotnet tools/RttyDecoder.Benchmarks/bin/Release/net10.0/RttyDecoder.Benchmarks.dll run --revision $env:BENCH_REVISION --output benchmark-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RttyDecoder-benchmark
          path: benchmark-results
          if-no-files-found: warn
      - name: Rapoarte in rezumatul rularii
        if: success()
        shell: pwsh
        run: |
          Get-Content benchmark-results/fsk-report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content benchmark-results/decode-report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
